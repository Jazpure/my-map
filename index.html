<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>spime</title>
<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; background: #f4f2ec; }
  #map { position: absolute; inset: 0; }

  /* birds fly over the page, not with it — screen space, never interactive */
  #birds { position: absolute; inset: 0; z-index: 6; pointer-events: none; }

  /* the hand-lettered title, traced from the original drawing */
  #titleblock { position: absolute; top: 20px; left: 22px; z-index: 10; }
  #title { display: block; width: 168px; pointer-events: none; user-select: none; }
  #textlink, #designlink {
    display: block; margin: 15px 0 0 8px; padding: 0;
    font: 600 12px/1 "Courier New", Courier, monospace;
    letter-spacing: .08em; color: #2b2721;
    background: none; border: 0; border-bottom: 1px solid #b9b2a2;
    cursor: pointer;
  }
  #textlink:hover, #designlink:hover { border-bottom-color: #2b2721; }

  /* The design note, bottom left. Unlike the title it is not always there:
     it belongs to the wide views, where you are still reading the piece as a
     whole, and it is out of the way by the time you are down among the
     letters. Opacity is set from the zoom in the same handler the rest of
     the page uses. */
  #designblock { position: absolute; bottom: 24px; left: 22px; z-index: 10; }
  #designlink { margin: 0; transition: opacity .28s ease; }

  /* the essay, as a sheet of paper over the map */
  #sheet {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center;
    background: rgba(36, 33, 28, .30);
  }
  #sheet[hidden] { display: none; }
  #sheetpaper {
    position: relative; display: flex; flex-direction: column;
    width: min(760px, 84vw); height: 84vh;
    background: #fff; box-shadow: 0 20px 70px rgba(0,0,0,.25);
  }
  .sheetbody {
    overflow-y: auto; padding: 62px 64px 56px;
    font: 400 14px/1.85 "Courier New", Courier, monospace;
    color: #23201b;
  }
  .sheetbody[hidden] { display: none; }
  .sheetbody p { margin: 0 0 1.5em; }
  .sheetbody p:last-child { margin-bottom: 0; }
  .sheetbody h2 {
    margin: 0 0 1.5em; font: 600 14px/1.85 inherit;
    letter-spacing: .08em; text-transform: lowercase;
  }
  .sheetbody ul { margin: 0; padding-left: 1.4em; }
  .sheetbody li { margin: 0 0 1.5em; }
  .sheetbody li:last-child { margin-bottom: 0; }
  /* the ledger, kept deliberately small: it is the fine print of the piece */
  #ledgerline {
    margin-top: 3.4em; padding-top: 1.2em; border-top: 1px solid #e6e1d6;
    font-size: 11px; letter-spacing: .06em; color: #8a8272;
  }
  #ledgerline a { color: #8a8272; }
  #ledgerline a:hover { color: #23201b; }
  #sheetclose {
    position: absolute; top: 12px; right: 14px; z-index: 1;
    width: 28px; height: 28px; padding: 0; line-height: 1;
    font: 400 17px/1 "Courier New", Courier, monospace;
    color: #6d6656; background: #fff; border: 1px solid #ddd8cb;
    border-radius: 2px; cursor: pointer;
  }
  #sheetclose:hover { color: #23201b; border-color: #8d8778; }

</style>
</head>
<body>
<div id="map"></div>
<div id="titleblock">
  <img id="title" src="title/mymap.svg" alt="my map">
  <button id="textlink">text</button>
</div>

<div id="designblock">
  <button id="designlink">design</button>
</div>

<div id="sheet" hidden>
  <div id="sheetpaper">
    <button id="sheetclose" aria-label="close">&#215;</button>
    <div id="sheettext" class="sheetbody"></div>
    <div id="designtext" class="sheetbody" hidden></div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.1.12/dist.min.js"></script>
<script src="https://unpkg.com/tone@15.1.22/build/Tone.js"></script>
<script src="score.js?v=1789067202"></script>
<script src="grains.js?v=1789067202"></script>
<script src="pool.js?v=1789067202"></script>
<script src="audio.js?v=1789067202"></script>
<script src="prose.js?v=1789067202"></script>
<script src="birds.js?v=1789067202"></script>
<script src="inscribe.js?v=1789067202"></script>
<script>
// ---------------------------------------------------------------------------
// A printed page.
//
// build.py has baked a `lit` value onto every building footprint and street
// segment the trace touches and dropped everything it doesn't. Nothing here
// computes proximity — this only draws what the file already says.
//
// There is no basemap. The look settled on hiding it entirely, so rather than
// load a street style and then switch every layer of it off, the map is
// created with a bare paper background and only the three layers this piece
// actually uses. That removes a network dependency, a pile of unused tiles,
// and the load-order problem that came with waiting on a remote style.
// ---------------------------------------------------------------------------

const PAPER = '#f4f2ec';

const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {},
    layers: [{ id: 'paper', type: 'background', paint: { 'background-color': PAPER } }],
  },
  center: [-73.9505, 40.6870],
  zoom: 13.4,
  pitch: 0,
  bearing: 0,
  // Capped where the letters are on the point of disappearing. Below the
  // coarsest level's fade-in there is nothing on the page at all, and an
  // empty sheet is not a view of anything.
  minZoom: Inscription.CFG.levelAt[0] + Inscription.CFG.levelSpan * 0.5,
  antialias: true,
});
map.addControl(new maplibregl.NavigationControl(), 'bottom-right');
new ResizeObserver(() => map.resize()).observe(document.getElementById('map'));

// Paper tones, darkening with visits. Nothing emits — the page just gets
// dirtier where you were. Flat fills: at zero pitch an extrusion is only a
// more expensive way to draw the same footprint.
const LIT_COLOR = [
  'interpolate', ['linear'], ['get', 'lit'],
  0.00, '#f0eee7',
  0.30, '#e9e6dd',
  0.70, '#e0dcd1',
  1.00, '#d6d1c3',
];

async function addLayers() {
  // All three are fetched here rather than handed to MapLibre as URLs. The
  // buildings have to be, since the density field and the inscription both
  // read the features — but the other two are done the same way so that
  // `cache: 'no-cache'` applies to all of them. Handing MapLibre a URL let
  // the browser serve a stale copy after a rebuild, which looks exactly like
  // the build having silently failed.
  const get = u => fetch(u, { cache: 'no-cache' }).then(r => r.json());
  const [buildings, streets, boroughs, subway] = await Promise.all([
    get('data/buildings.geojson'),
    get('data/streets.geojson'),
    get('data/boroughs.geojson'),
    get('data/subway.geojson').catch(() => null),
  ]);

  map.addSource('lit-city', { type: 'geojson', data: buildings });
  map.addSource('lit-ways', { type: 'geojson', data: streets });
  map.addSource('boro', { type: 'geojson', data: boroughs });

  map.addLayer({
    id: 'boroughs',
    type: 'line',
    source: 'boro',
    paint: {
      'line-color': '#a9a294',
      'line-width': ['interpolate', ['linear'], ['zoom'], 11, 0.6, 16, 1.4],
      'line-opacity': 0.8,
    },
  });

  map.addLayer({
    id: 'lit-buildings',
    type: 'fill',
    source: 'lit-city',
    paint: { 'fill-color': LIT_COLOR, 'fill-opacity': 0.85 },
  });

  map.addLayer({
    id: 'lit-streets',
    type: 'line',
    source: 'lit-ways',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: {
      // printed lines, not light. one ink, one hairline weight, and density
      // shows only as how firmly the pen was pressed.
      'line-color': '#8d8778',
      'line-width': ['interpolate', ['linear'], ['zoom'], 11, 0.4, 17, 1.1],
      'line-opacity': ['interpolate', ['linear'], ['get', 'lit'], 0.0, 0.16, 1.0, 0.42],
    },
  });

  return { buildings, boroughs, subway };
}

// ---------------------------------------------------------------------------
// The writing
// ---------------------------------------------------------------------------

const overlay = new deck.MapboxOverlay({ interleaved: false, layers: [] });
let clock = 0;

// Prose first so the node letters sit on top of it — the field is the ground
// the mass sits in, not something laid over it.
const setLayers = () => overlay.setProps({
  layers: [Prose.layer(map, clock), ...Inscription.layer(map, clock)].filter(Boolean),
});

map.once('style.load', async () => {
  map.addControl(overlay);
  const { buildings, boroughs, subway } = await addLayers();

  frameTo();
  Birds.init(document.getElementById('map'), map)
    .then(n => console.log(`${n} birds loaded`))
    .catch(e => console.warn('birds unavailable', e));
  Density.build(buildings);
  const essay = await fetch('text/essay.txt', { cache: 'no-cache' }).then(r => r.text());
  // the drawn type has to be in the atlas before either layer is built
  const drawnCount = await Inscription.loadHand('type/hand.png', 'type/hand.json')
    .catch(e => { console.warn('drawn type unavailable', e); return 0; });
  console.log(`${drawnCount} hand-drawn glyphs loaded`);
  // the same text the map is made of, held for the reading sheet
  document.getElementById('sheettext').innerHTML = essay
    .trim().split(/\n\s*\n/)
    .map(par => `<p>${par.trim().replace(/</g, '&lt;')}</p>`).join('');
  loadDesign();
  Prose.build(boroughs, essay, buildings);
  Inscription.build(buildings, essay, subway);

  (function animate(ms) {
    requestAnimationFrame(animate);
    clock = ms / 1000;
    setLayers();
  })(0);
});

// The opening frame.
//
// Not the whole city and not the trace either. Fitting all five boroughs put
// Staten Island and the far Bronx on the page for the sake of completeness and
// pushed everything you actually did into a corner; fitting the trace cropped
// so tight it read as a detail of something unseen. This is set by hand: the
// bottom of Brooklyn is cut away because you were never down there, and the
// west tip of Manhattan sits low and left, so the piece opens looking north
// and east across the ground it uses. Nodes falling outside the frame is the
// point — there is more here than one view holds.
const OPENING = [[-74.05, 40.63], [-73.82, 40.85]];

function frameTo() {
  map.fitBounds(OPENING, { padding: 0, duration: 0 });
}

// ---------------------------------------------------------------------------
// Sound. Listener = where the map is looking; centre gives position, zoom
// gives altitude, and both are just distance as far as the mix is concerned.
// ---------------------------------------------------------------------------

const listener = () => {
  const c = map.getCenter();
  return { lng: c.lng, lat: c.lat, zoom: map.getZoom() };
};

setInterval(() => {
  if (!Audio.isStarted()) return;
  const l = listener();
  Audio.update(l);
  Pool.update({ zoom: l.zoom, density: Density.at(l.lng, l.lat) });
}, 120);

// The reading sheet. One sheet of paper, two things it can hold: the essay
// the map is made of, and the note about how it was made.
(() => {
  const sheet = document.getElementById('sheet');
  const panels = { text: document.getElementById('sheettext'),
                   design: document.getElementById('designtext') };
  const open = which => {
    for (const k in panels) panels[k].hidden = k !== which;
    panels[which].scrollTop = 0;
    sheet.hidden = false;
  };
  const shut = () => { sheet.hidden = true; };
  document.getElementById('textlink').onclick = () => open('text');
  document.getElementById('designlink').onclick = () => open('design');
  document.getElementById('sheetclose').onclick = shut;
  // clicking the surround closes it; clicking the paper itself does not
  sheet.onclick = e => { if (e.target === sheet) shut(); };
  window.addEventListener('keydown', e => { if (e.key === 'Escape') shut(); });
})();

// The design note. Lines beginning with `- ` are bullets, a leading `# ` is
// the heading, anything else is a paragraph — so the note stays a plain text
// file that can be edited without touching this page.
async function loadDesign() {
  const el = document.getElementById('designtext');
  let src;
  try {
    src = await fetch('text/design.txt', { cache: 'no-cache' }).then(r => r.text());
  } catch (e) {
    console.warn('design note unavailable', e);
    document.getElementById('designblock').hidden = true;
    return;
  }
  const esc = s => s.replace(/</g, '&lt;');
  const out = [];
  let list = [];
  const flush = () => { if (list.length) { out.push(`<ul>${list.join('')}</ul>`); list = []; } };
  for (const raw of src.trim().split('\n')) {
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith('- ')) list.push(`<li>${esc(line.slice(2))}</li>`);
    else { flush(); out.push(line.startsWith('# ')
      ? `<h2>${esc(line.slice(2))}</h2>` : `<p>${esc(line)}</p>`); }
  }
  flush();
  out.push('<p id="ledgerline">' +
           '<a href="ledger.html" target="_blank" rel="noopener">ledger</a></p>');
  el.innerHTML = out.join('');
}

// The design link belongs to the wide views. It is legible while you are
// still reading the piece whole and gone well before you are down among the
// letters — it goes first, ahead of the birds, since it is the one thing on
// the page that is not the work.
const DESIGN_FADE = [11.0, 12.3];

function fadeDesign() {
  const el = document.getElementById('designlink');
  if (!el) return;
  const [a, b] = DESIGN_FADE;
  const z = map.getZoom();
  const o = z <= a ? 1 : z >= b ? 0 : (b - z) / (b - a);
  el.style.opacity = o.toFixed(3);
  el.style.pointerEvents = o < 0.08 ? 'none' : '';
}
map.on('zoom', fadeDesign);
map.on('move', fadeDesign);
fadeDesign();

// Sound starts on the first touch of the page rather than behind a button.
// Browsers will not open an audio context without a user gesture, so this
// waits for one — but any gesture will do, and moving the map is one.
//
// It keeps waiting until sound is actually running, rather than until it has
// tried once. The old version disarmed itself on the first attempt, which is
// why the page was sometimes silent for its whole life: trackpad and wheel
// scrolling do not count as activation in Chrome, so a session spent zooming
// rather than clicking never unlocked anything; a click landing while the main
// thread was busy building the inscription could outlive its own activation
// window; and a single stalled request left a half-built engine that reported
// itself as started. None of those are recoverable by the page — but all of
// them are recoverable on the next click, so every gesture is another attempt
// and the context's own state is what decides whether to stop listening.
(() => {
  const EVENTS = ['pointerdown', 'pointerup', 'keydown', 'touchstart', 'wheel'];
  let busy = false;

  const begin = async () => {
    if (busy || Audio.isRunning()) return;
    busy = true;
    try {
      await Audio.start();
      Audio.update(listener());
    } catch (e) {
      console.warn('audio could not start; will try again on the next gesture', e);
    }
    busy = false;
    if (Audio.isRunning()) {
      for (const ev of EVENTS) window.removeEventListener(ev, begin);
    }
  };

  for (const ev of EVENTS) window.addEventListener(ev, begin, { passive: true });

  // A running context can still be taken away — the tab sleeps, or the system
  // hands the audio device to something else. Coming back to the page puts it
  // back rather than leaving the piece silent.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && Audio.isStarted()) Audio.resume();
  });
})();
</script>
</body>
</html>
